<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日語語音朗讀測試</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    .card {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 80px;
      margin: 10px 0;
      padding: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }
    select, button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background-color: #45a049;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔊 日語語音朗讀測試 (GitHub Pages)</h2>
    
    <label for="textInput">請輸入要朗讀的文字：</label>
    <textarea id="textInput">こんにちは、日本語の音声テストです。</textarea>

    <div class="controls">
      <label for="langSelect">選擇語言：</label>
      <select id="langSelect">
        <option value="ja-JP" selected>日文 (ja-JP)</option>
        <option value="zh-TW">繁體中文 (zh-TW)</option>
        <option value="en-US">英文 (en-US)</option>
      </select>

      <button id="playBtn">播放發音</button>
    </div>

    <div id="status">準備就緒</div>
  </div>

  <script>
    document.getElementById('playBtn').addEventListener('click', () => {
      const text = document.getElementById('textInput').value.trim();
      const lang = document.getElementById('langSelect').value;
      const statusEl = document.getElementById('status');

      if (!text) {
        alert('請輸入要朗讀的文字！');
        return;
      }

      // 檢查瀏覽器是否支援
      if (!('speechSynthesis' in window)) {
        statusEl.textContent = '❌ 您的瀏覽器不支援語音合成功能';
        return;
      }

      // 停止先前正在播放的語音
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang; 

      utterance.onstart = () => {
        statusEl.textContent = '🔊 正在播放...';
      };

      utterance.onend = () => {
        statusEl.textContent = '✅ 播放完成';
      };

      utterance.onerror = (event) => {
        console.error("語音播放錯誤:", event);
        statusEl.textContent = '❌ 播放失敗，請檢查瀏覽器權限';
      };

      // 執行發音
      window.speechSynthesis.speak(utterance);
    });
  </script>

</body>
</html>
