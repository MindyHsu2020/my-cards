<!DOCTYPE html>

            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 26px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #eef2f3;
        }
        th {
            background-color: #34495e;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #fafbfc;
        }
        ruby {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.5;
        }
        rt {
            font-size: 13px;
            font-weight: normal;
            padding-bottom: 4px;
        }
        rt.first-rt {
            color: #1e88e5 !important;
            font-weight: bold;
        }
        rt.normal-rt {
            color: #333333;
        }
        .overline {

            text-decoration-thickness: 2px;
            color: #e74c3c;
            font-weight: bold;
        }
        .accent-num {
            color: #7f8c8d;

        .pos-badge {
            color: #2c3e50;
            font-weight: bold;
            font-size: 14px;
        }
        .mean-text {

        }
        .btn-play {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s;

        .btn-play:hover { background-color: #27ae60; }

</head>

    function playAudio(text) {

        const audio = new Audio(url);
        audio.play().catch(e => console.log(e));
    }
    
    function playAudioM(text) {
        // 改用微軟日文標準語音介面，在 GitHub Pages 上完全不受網域與 CORS 的阻擋限制
        const url = `https://microsofttranslator.com{encodeURIComponent(text)}`;
        const audio = new Audio(url);
        audio.play();
    }
