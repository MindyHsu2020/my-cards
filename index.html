<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日語單字真人發音單字卡</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f7fa; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #2c3e50; margin-bottom: 30px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1200px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 25px; width: 280px; position: relative; border: 1px solid #e2e8f0; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .type { font-size: 12px; color: #a0aec0; font-weight: bold; margin-bottom: 8px; }
        .word { font-size: 28px; color: #1a202c; font-weight: 700; margin: 10px 0; }
        .kana { font-size: 16px; color: #718096; margin-bottom: 12px; }
        .mean { font-size: 15px; color: #4a5568; border-top: 1px solid #edf2f7; padding-top: 12px; margin-top: 12px; }
        .audio-btn { position: absolute; top: 20px; right: 20px; background: #3182ce; color: white; border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .audio-btn:hover { background: #2b6cb0; }
        .audio-btn svg { width: 18px; height: 18px; fill: white; }
    </style>
</head>
<body>

    <h1>🇯🇵 日語核心單字卡（標準真人發音版）</h1>

    <div class="container">
        <!-- 單字卡 1 -->
        <div class="card">
            <div class="type">平板型 [0]</div>
            <button class="audio-btn" onclick="playAudio('具合')">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="word">具合</div>
            <div class="kana">ぐあい</div>
            <div class="mean">身體狀況、事物狀態</div>
        </div>

        <!-- 單字卡 2 -->
        <div class="card">
            <div class="type">平板型 [0]</div>
            <button class="audio-btn" onclick="playAudio('銀行')">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="word">銀行</div>
            <div class="kana">ぎんこう</div>
            <div class="mean">銀行</div>
        </div>

        <!-- 單字卡 3 -->
        <div class="card">
            <div class="type">平板型 [0]</div>
            <button class="audio-btn" onclick="playAudio('学生')">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="word">學生</div>
            <div class="kana">がくせい</div>
            <div class="mean">學生</div>
        </div>

        <!-- 單字卡 4 -->
        <div class="card">
            <div class="type">頭高型 [1]</div>
            <button class="audio-btn" onclick="playAudio('ご飯')">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="word">ご飯</div>
            <div class="kana">ごはん</div>
            <div class="mean">飯、餐點</div>
        </div>

        <!-- 單字卡 5 -->
        <div class="card">
            <div class="type">頭高型 [1]</div>
            <button class="audio-btn" onclick="playAudio('玄関')">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="word">玄関</div>
            <div class="kana">げんかん</div>
            <div class="mean">玄關、門口</div>
        </div>
    </div>

    <script>
        function playAudio(text) {
            // 使用新版且支援 HTTPS 的 Google TTS 語音接口，並加入強制的用戶端行為以防止被阻擋
            const audioUrl = `https://google.com{encodeURIComponent(text)}`;
            
            const audio = new Audio(audioUrl);
            audio.play().catch(error => {
                console.error("my-cards/:168 音檔播放失敗，請檢查網路連線：", error);
                alert("無法載入發音，請確認您的裝置已連接網路並允許音檔自動播放。");
            });
        }
    </script>
</body>
</html>
