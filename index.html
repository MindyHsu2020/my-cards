<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日語單字真人發音單字卡</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 24px;
            text-align: center;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #eef2f5;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
        }
        .accent-info {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 8px;
            font-weight: bold;
            background: #edf2f7;
            padding: 2px 8px;
            border-radius: 4px;
            align-self: flex-start;
        }
        .word-title {
            font-size: 28px;
            font-weight: bold;
            color: #2d3748;
            margin: 5px 0;
        }
        .kana {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 12px;
        }
        .meaning {
            font-size: 15px;
            color: #718096;
            border-top: 1px dashed #e2e8f0;
            padding-top: 12px;
            margin-top: auto;
        }
        .audio-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 4px rgba(49, 130, 206, 0.3);
            transition: background-color 0.2s;
        }
        .audio-btn:hover {
            background-color: #2b6cb0;
        }
        .audio-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <h1>🇯🇵 日語核心單字卡（標準真人發音版）</h1>
    
    <div class="container">
        <!-- 具合 -->
        <div class="card">
            <span class="accent-info">平板型 [0]</span>
            <div class="word-title">具合</div>
            <div class="kana">ぐあい</div>
            <button class="audio-btn" onclick="playAudio('ぐあい')">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="meaning">身體狀況、事物狀態</div>
        </div>

        <!-- 銀行 -->
        <div class="card">
            <span class="accent-info">平板型 [0]</span>
            <div class="word-title">銀行</div>
            <div class="kana">ぎんこう</div>
            <button class="audio-btn" onclick="playAudio('ぎんこう')">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="meaning">銀行</div>
        </div>

        <!-- 学生 -->
        <div class="card">
            <span class="accent-info">平板型 [0]</span>
            <div class="word-title">学生</div>
            <div class="kana">がくせい</div>
            <button class="audio-btn" onclick="playAudio('がくせい')">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="meaning">學生</div>
        </div>

        <!-- ご飯 -->
        <div class="card">
            <span class="accent-info">頭高型 [1]</span>
            <div class="word-title">ご飯</div>
            <div class="kana">ごはん</div>
            <button class="audio-btn" onclick="playAudio('ごはん')">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="meaning">飯、餐點</div>
        </div>

        <!-- 玄関 -->
        <div class="card">
            <span class="accent-info">頭高型 [1]</span>
            <div class="word-title">玄関</div>
            <div class="kana">げんかん</div>
            <button class="audio-btn" onclick="playAudio('げんかん')">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="meaning">玄關、門口</div>
        </div>
    </div>

    <script>
        function playAudio(text) {
            // 使用公開的高保真日語真人發音串流 API
            const audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=2`;
            const audio = new Audio(audioUrl);
            audio.play().catch(error => {
                console.error("音檔播放失敗，請檢查網路連線：", error);
                alert("無法載入發音，請確認您的裝置已連接網路。");
            });
        }
    </script>
</body>
</html>
